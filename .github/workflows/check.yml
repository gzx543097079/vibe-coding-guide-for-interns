name: PR 检查

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          # lastUpdated 需要完整的提交历史
          fetch-depth: 0

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      # 提示词被改动但没有重新验证时，这一步会失败
      - name: 检查提示词快照
        run: npm run check:prompts

      - name: 构建站点
        run: npm run build
