<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>快拍分段进度</title>
<script>
  // URL 带 ?dark 时使用深色值
  if (new URLSearchParams(location.search).has('dark')) {
    document.documentElement.classList.add('dark');
  }
</script>
<style>
  :root {
    --bg: #ffffff;
    --ink: #000000;
    --ink-2: #6e6e73;
    --line: #c6c6c8;
    --soft: #f2f2f7;
    --accent: #0071e3;
    --on-accent: #ffffff;
    --danger: #ff3b30;
    --success: #34c759;
    --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
    --ease-in: cubic-bezier(0.4, 0, 1, 1);
  }
  html.dark {
    --bg: #000000;
    --ink: #ffffff;
    --ink-2: #98989f;
    --line: #38383a;
    --soft: #1c1c1e;
    --accent: #0a84ff;
    --on-accent: #ffffff;
    --danger: #ff453a;
    --success: #30d158;
  }

  *, *::before, *::after { box-sizing: border-box; }

  html, body { margin: 0; }
  body {
    background: #888;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 14px;
    line-height: 1.5;
  }

  button {
    border: 0;
    background: transparent;
    font: inherit;
    color: inherit;
    padding: 0;
    margin: 0;
  }

  #canvas {
    position: relative;
    left: 0;
    top: 0;
    width: 248px;
    height: 442px;
    overflow: hidden;
    background: var(--bg);
  }

  /* 全屏卡片：浅色、深色外观相同 */
  .story {
    position: absolute;
    inset: 0;
    color: #fff;
    background: oklch(0.55 0.13 250);
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }

  /* 顶部区域 */
  .story-top {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    padding: 10px 10px 0;
    z-index: 3;
    opacity: 1;
    transition: opacity 200ms var(--ease);
  }
  .story.is-holding .story-top { opacity: 0; }

  .story-bars {
    display: flex;
    gap: 4px;
  }
  .story-bar {
    flex: 1 1 0;
    height: 3px;
    border-radius: 2px;
    background: rgb(255 255 255 / 0.35);
    overflow: hidden;
  }
  .story-bar-fill {
    width: 100%;
    height: 100%;
    background: #fff;
    transform: scaleX(0);
    transform-origin: left center;
  }

  .story-head {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 10px;
    padding: 0 2px;
  }
  .story-avatar {
    flex: none;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: rgb(255 255 255 / 0.22);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 700;
  }
  .story-name { font-size: 13px; font-weight: 600; }
  .story-time { font-size: 12px; opacity: 0.7; }

  .story-pause {
    flex: none;
    margin-left: auto;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .story-pause:hover { background: rgb(255 255 255 / 0.18); }
  .story-pause svg { width: 14px; height: 14px; fill: #fff; display: block; }

  /* 正文：外层负责垂直居中，内层负责进入动画 */
  .story-body {
    position: absolute;
    left: 20px;
    right: 20px;
    top: 0;
    bottom: 0;
    z-index: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .story-body-inner { animation: story-enter 280ms var(--ease) both; }
  .story-title {
    margin: 0;
    font-size: 22px;
    font-weight: 800;
    line-height: 1.3;
  }
  .story-sub {
    margin: 8px 0 0;
    font-size: 13px;
    opacity: 0.8;
  }

  @keyframes story-enter {
    from { opacity: 0; transform: scale(1.04); }
    to   { opacity: 1; transform: scale(1); }
  }
  @keyframes story-enter-reduced {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  /* 透明点击区 */
  .story-zone {
    position: absolute;
    top: 64px;
    bottom: 0;
    z-index: 2;
    cursor: pointer;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
  }
  .story-zone-prev { left: 0; width: 32%; }
  .story-zone-next { right: 0; width: 68%; }

  /* 键盘焦点环 */
  .story button:focus { outline: none; }
  .story button:focus-visible {
    outline: 2px solid #fff;
    outline-offset: -4px;
  }

  @media (prefers-reduced-motion: reduce) {
    .story-body-inner { animation-name: story-enter-reduced; }
  }
</style>
</head>
<body>
<div id="canvas">
  <div class="story" id="story" role="group" aria-label="快拍">
    <div class="story-top">
      <div class="story-bars" aria-hidden="true">
        <div class="story-bar"><div class="story-bar-fill"></div></div>
        <div class="story-bar"><div class="story-bar-fill"></div></div>
        <div class="story-bar"><div class="story-bar-fill"></div></div>
        <div class="story-bar"><div class="story-bar-fill"></div></div>
      </div>
      <div class="story-head">
        <span class="story-avatar" aria-hidden="true">林</span>
        <span class="story-name">林夕</span>
        <span class="story-time">2 小时前</span>
        <button type="button" class="story-pause" id="pauseBtn" aria-label="暂停" aria-pressed="false">
          <svg viewBox="0 0 14 14" aria-hidden="true" focusable="false"><path id="pauseIcon" d="M3.5 2.5h2.5v9H3.5zM8 2.5h2.5v9H8z"/></svg>
        </button>
      </div>
    </div>

    <div class="story-body" aria-live="polite">
      <div class="story-body-inner" id="bodyInner">
        <p class="story-title" id="title"></p>
        <p class="story-sub" id="sub"></p>
      </div>
    </div>

    <button type="button" class="story-zone story-zone-prev" id="zonePrev" aria-label="上一条"></button>
    <button type="button" class="story-zone story-zone-next" id="zoneNext" aria-label="下一条"></button>
  </div>
</div>

<script>
(function () {
  var ITEMS = [
    { h: 250, title: '今天的构建通过了', sub: '主分支 12 个检查全部通过' },
    { h: 150, title: '新成员加入', sub: '欢迎两位实习生加入前端组' },
    { h: 30,  title: '周五下午评审', sub: '三点，线上会议室' },
    { h: 330, title: '本周合并 18 个 PR', sub: '比上周多 5 个' }
  ];
  var DURATION = 4000;   // 每条播放时长
  var TAP_MS = 250;      // 短于此时长算点击
  var ICON_PAUSE = 'M3.5 2.5h2.5v9H3.5zM8 2.5h2.5v9H8z';
  var ICON_PLAY = 'M4 2.5v9l7.5-4.5z';

  var story = document.getElementById('story');
  var fills = Array.prototype.slice.call(story.querySelectorAll('.story-bar-fill'));
  var bodyInner = document.getElementById('bodyInner');
  var titleEl = document.getElementById('title');
  var subEl = document.getElementById('sub');
  var pauseBtn = document.getElementById('pauseBtn');
  var pauseIcon = document.getElementById('pauseIcon');
  var zonePrev = document.getElementById('zonePrev');
  var zoneNext = document.getElementById('zoneNext');

  var index = 0;
  var elapsed = 0;          // 当前条已播放时间
  var pausedByButton = false;
  var holding = false;      // 按住暂停
  var lastTs = null;

  function renderBars() {
    for (var i = 0; i < fills.length; i++) {
      var p = i < index ? 1 : i > index ? 0 : Math.min(elapsed / DURATION, 1);
      fills[i].style.transform = 'scaleX(' + p + ')';
    }
  }

  function show(i) {
    index = i;
    elapsed = 0;
    var item = ITEMS[index];
    story.style.background = 'oklch(0.55 0.13 ' + item.h + ')';
    titleEl.textContent = item.title;
    subEl.textContent = item.sub;
    // 重新触发正文进入动画
    bodyInner.style.animation = 'none';
    void bodyInner.offsetWidth;
    bodyInner.style.animation = '';
    renderBars();
  }

  function next() { show((index + 1) % ITEMS.length); }
  function prev() { show(index > 0 ? index - 1 : 0); } // 第一条时从头重播

  function tick(ts) {
    if (lastTs === null) lastTs = ts;
    var dt = ts - lastTs;
    lastTs = ts;
    if (!pausedByButton && !holding) {
      // 限制单帧增量，页面从后台回来时不会一次跳过多条
      if (dt > 1000) dt = 0;
      elapsed += dt;
      if (elapsed >= DURATION) {
        next(); // 每帧最多前进一条，已播放时间归零
      } else {
        renderBars();
      }
    }
    requestAnimationFrame(tick);
  }

  document.addEventListener('visibilitychange', function () {
    lastTs = null; // 回到前台后重新计时，后台时间不计入
  });

  // 暂停按钮
  pauseBtn.addEventListener('click', function () {
    pausedByButton = !pausedByButton;
    pauseBtn.setAttribute('aria-pressed', String(pausedByButton));
    pauseBtn.setAttribute('aria-label', pausedByButton ? '继续播放' : '暂停');
    pauseIcon.setAttribute('d', pausedByButton ? ICON_PLAY : ICON_PAUSE);
  });

  // 点击区：按住暂停，短按切换
  function bindZone(zone, action) {
    var activePointer = null;
    var downAt = 0;

    function release(e, allowTap) {
      if (activePointer === null || e.pointerId !== activePointer) return;
      activePointer = null;
      holding = false;
      story.classList.remove('is-holding');
      if (allowTap && performance.now() - downAt < TAP_MS) action();
    }

    zone.addEventListener('pointerdown', function (e) {
      if (activePointer !== null) return;
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      // 触摸默认会隐式捕获指针，释放后才能收到 pointerleave
      if (zone.hasPointerCapture && zone.hasPointerCapture(e.pointerId)) {
        zone.releasePointerCapture(e.pointerId);
      }
      activePointer = e.pointerId;
      downAt = performance.now();
      holding = true;
      story.classList.add('is-holding');
    });
    zone.addEventListener('pointerup', function (e) { release(e, true); });
    zone.addEventListener('pointerleave', function (e) { release(e, false); });
    zone.addEventListener('pointercancel', function (e) { release(e, false); });
    zone.addEventListener('contextmenu', function (e) { e.preventDefault(); });

    // 键盘回车 / 空格或读屏触发的 click（detail 为 0）；指针点击已在 pointerup 处理
    zone.addEventListener('click', function (e) {
      if (e.detail === 0) action();
    });
  }
  bindZone(zonePrev, prev);
  bindZone(zoneNext, next);

  // 键盘左右方向键
  story.addEventListener('keydown', function (e) {
    if (e.altKey || e.ctrlKey || e.metaKey || e.shiftKey) return;
    if (e.key === 'ArrowRight') { e.preventDefault(); next(); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); prev(); }
  });

  show(0);
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
